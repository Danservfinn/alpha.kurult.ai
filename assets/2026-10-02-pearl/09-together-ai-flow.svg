<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
<title id="t">How the Together AI and Pearl endpoint works</title>
<desc id="d">A developer sends an inference request to Together's Gemma-4-31B-it-Pearl endpoint. The GPU computes the answer and Pearl proof of work at once. The answer goes back to the developer at a discount of over 25 percent; PRL mining rewards are sold or valued to offset that discount.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b08d57"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5fa8a0"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c4664a"/></marker>
<style>
text{font-family:sans-serif;fill:#f3ead7}
.h{font-size:20px}.s{font-size:13px;fill:#c9c0ae}.f{font-size:11.5px;fill:#8a8273}.k{font-size:12px;letter-spacing:.12em;fill:#b08d57}.n{font-size:13px;fill:#14120e;font-weight:bold}
.box{fill:#1b1813;stroke:#3a3226;stroke-width:1.2}.hot{fill:#1b1813;stroke:#b08d57;stroke-width:1.4}.use{fill:#1b1813;stroke:#5fa8a0;stroke-width:1.4}.sell{fill:#1b1813;stroke:#c4664a;stroke-width:1.4}
.ln{stroke:#b08d57;stroke-width:1.6;fill:none}.lt{stroke:#5fa8a0;stroke-width:1.6;fill:none}.lr{stroke:#c4664a;stroke-width:1.8;fill:none}
</style>
</defs>
<rect width="960" height="560" fill="#14120e"/>
<text x="32" y="44" class="h">The Together AI flow: PRL emissions pay for cheaper inference</text>
<text x="32" y="68" class="s">One GPU job produces two things: the model's answer and Pearl proof of work. The PRL reward subsidises the price.</text>
<text x="928" y="30" class="f" text-anchor="end">alpha.kurult.ai | research only</text>
<rect x="32" y="110" width="200" height="86" rx="4" class="box"/><text x="48" y="138">Developer / app</text><text x="48" y="160" class="s">sends a prompt to</text><text x="48" y="178" class="s">the Pearl endpoint</text>
<path d="M232 140 H330" class="ln" marker-end="url(#a)"/><circle cx="281" cy="140" r="11" fill="#b08d57"/><text x="281" y="145" class="n" text-anchor="middle">1</text>
<text x="281" y="124" class="f" text-anchor="middle">request</text>
<rect x="334" y="100" width="290" height="108" rx="4" class="hot"/><text x="350" y="128">Together AI endpoint</text><text x="350" y="150" class="s">Gemma-4-31B-it-Pearl</text><text x="350" y="170" class="s">INT8, 32K context</text><text x="350" y="190" class="s">"exclusive partnership" (May 15)</text>
<path d="M479 208 V262" class="ln" marker-end="url(#a)"/><circle cx="479" cy="236" r="11" fill="#b08d57"/><text x="479" y="241" class="n" text-anchor="middle">2</text>
<rect x="334" y="266" width="290" height="92" rx="4" class="hot"/><text x="350" y="292">GPU runs the model</text><text x="350" y="314" class="s">matrix multiplications with Pearl</text><text x="350" y="332" class="s">noise: inference and mining at once</text>
<path d="M334 312 H60 V200" class="lt" marker-end="url(#at)"/><circle cx="262" cy="312" r="11" fill="#5fa8a0"/><text x="262" y="317" class="n" text-anchor="middle">3</text>
<text x="76" y="232" class="s" style="fill:#5fa8a0">Answer returned at a discount</text>
<text x="76" y="252" class="s">$0.28 in / $0.86 out per 1M tokens</text>
<text x="76" y="272" class="s">"discounted by over 25%"</text>
<path d="M624 312 H700" class="ln" marker-end="url(#a)"/><circle cx="662" cy="312" r="11" fill="#b08d57"/><text x="662" y="317" class="n" text-anchor="middle">4</text>
<rect x="704" y="266" width="224" height="92" rx="4" class="box"/><text x="720" y="292">Pearl network</text><text x="720" y="314" class="s">valid proof wins a block:</text><text x="720" y="332" class="s">2,287 PRL reward</text>
<path d="M816 266 V208" class="lr" marker-end="url(#ar)"/><circle cx="816" cy="238" r="11" fill="#c4664a"/><text x="816" y="243" class="n" text-anchor="middle">5</text>
<rect x="704" y="100" width="224" height="108" rx="4" class="sell"/><text x="720" y="128">PRL reward to the miner</text><text x="720" y="150" class="s">its value "offsets" the</text><text x="720" y="170" class="s">endpoint discount, so the</text><text x="720" y="190" class="s">PRL is in effect sold</text>
<path d="M704 154 H624" class="lr" marker-end="url(#ar)"/>
<rect x="32" y="390" width="896" height="104" rx="4" class="box" stroke-dasharray="4 4"/>
<text x="48" y="416" class="k">WHAT TO WATCH</text>
<text x="48" y="440" class="s">Together: "As the spot price of PRL increases, we expect to use more of the value generated by Pearl emissions" for the discount.</text>
<text x="48" y="460" class="s">The subsidy depends on PRL's price: a falling price shrinks the discount. The model page says it "is not available on Together's Serverless API".</text>
<text x="48" y="480" class="s">Pearl's own inference product is priced in USD, so there is no PRL sink on the demand side today.</text>
<text x="32" y="526" class="f">Sources: Together AI blog, partnership with Pearl Research Labs (May 15, 2026) and Gemma-4-31B-it-Pearl model page, both read 2026-10-02 16:07 ET;</text>
<text x="32" y="544" class="f">block reward from pearlchain.live stats (19:33 ET). Simplified schematic; Together's internal accounting is not public.</text>
</svg>
